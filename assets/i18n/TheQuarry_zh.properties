tutorial.step1          = Drill Down 的世界由多层构成，我们现在看到的是其中的表层。也许之后你会发现进入更深层的方法，并在那里找到隐藏的宝藏。
每一层大小都相同，并采用网格结构。
tutorial.step10         = 矿井已经开始运转，会不断开采石头，直到自身存储装满为止。但石头现在还没法离开矿井，进入你的存储或后续加工建筑。所以接下来你需要建造传送带。
打开建造菜单，然后在[ORANGE]“运输”[]中选择[ORANGE]“传送带”[]。
tutorial.step10_desktop = 矿井已经开始运转，会不断开采石头，直到自身存储装满为止。但石头现在还没法离开矿井，进入你的存储或后续加工建筑。所以接下来你需要建造传送带。
打开建造菜单[CHARTREUSE]（B）[]，然后在[ORANGE]运输[]中选择[ORANGE]传送带[]。
tutorial.step11         = [ORANGE]按照提示铺设传送带，把矿井和存储连接起来[]。传送带、管道和电缆都可以通过[CHARTREUSE]点击[]逐段建造。若在两个不同位置分别[CHARTREUSE]点击[]，就会启用辅助模式；此时你可以通过[CHARTREUSE]触摸并拖动[]两个端点标记，快速规划更长的一段线路。[CHARTREUSE]点击[]任意一个标记，就能一次性全部建好。
tutorial.step11_desktop = [ORANGE]按照提示铺设传送带，把矿井和存储连接起来[]。传送带、管道和电缆都可以通过[CHARTREUSE]点击[]逐段建造。若在两个不同位置分别[CHARTREUSE]点击[]，就会启用辅助模式；此时你可以通过[CHARTREUSE]点击并拖动[]两个端点标记，快速规划更长的一段线路。[CHARTREUSE]点击[]任意一个标记，就能一次性全部建好。
tutorial.step12         = 哎呀！这些传送带的方向看起来还不太对。要修正传送带或管道的朝向，你可以点击它们，再使用旋转按钮——没错，就是把它们转过来。
先[ORANGE]按 X 退出建造模式[]，然后[ORANGE]把传送带方向调正确[]。
tutorial.step12_desktop = 哎呀！这些传送带的方向看起来还不太对。要修正传送带或管道的朝向，你可以[CHARTREUSE]点击它们，再使用旋转按钮（热键 R）[]来调整方向。
先[ORANGE]按下红色 X 按钮退出建造模式[]，然后[ORANGE]把传送带方向调正确[]。
tutorial.step13         = 最后再补充一点：底部中央的另一个按钮可以用来拆除建筑，并返还一部分建造材料。
本教程到这里就结束了。你现在可以继续这一局，也可以通过游戏菜单重新开始。之后你也随时可以在主菜单里重玩本教程。
tutorial.step13_desktop = 最后再补充一点：底部中央的另一个按钮可以用来拆除建筑[CHARTREUSE]（热键 Delete）[]，并返还一部分建造材料。
本教程到这里就结束了。你现在可以继续这一局，也可以通过游戏菜单重新开始。之后你也随时可以在主菜单里重玩本教程。
tutorial.step2          = 你可以通过[CHARTREUSE]双指捏合[]来[CHARTREUSE]缩放[]，通过[CHARTREUSE]拖动[]来移动视角。
现在试着[ORANGE]缩小视野[]，让整层地图都能显示在屏幕中。
tutorial.step2_desktop  = 你可以用[CHARTREUSE]鼠标滚轮[]进行[CHARTREUSE]缩放[]，并通过[CHARTREUSE]WASD、方向键，或拖动鼠标[]来移动视角。
现在试着[ORANGE]缩小视野[]，让整层地图都能显示在屏幕中。
tutorial.step3          = 很好。正如你看到的，地图上分布着各种各样的“东西”。这些都是等待你开采和加工的资源。靠近看时，点击资源就能看到它的名称。
