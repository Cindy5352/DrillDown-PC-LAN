tutorial.step4          = 地图中央那座建筑就是你的存储设施。你的初始建材都存放在这里。建造新建筑时，所需材料必须先存在某个存储设施中。存储上的蓝色条会显示它装得有多满。
tutorial.step5          = 左上角可以暂停/继续游戏，并打开游戏菜单。
右上角则会显示你当前拥有的各种资源总量。
